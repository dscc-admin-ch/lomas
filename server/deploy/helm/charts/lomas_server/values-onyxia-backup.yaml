# Default values for lomas_server.

# Globals
global:
    imagePullSecrets: [] # list of name: secret.


# General stuff
nameOverride: ""
fullnameOverride: "lomas"

# Server / Worker
##########################################################################
server:
  image:
    repository: dsccadminch/lomas_server
    imagePullPolicy: Always
    tag: sha-88c42b4

  # Runtime args for server
  runtime_args:
    server:
      host_port: "8080"
      log_level: "info"
      submit_limit: 300
      time_attack:
        method: "jitter" # or "stall"
        magnitude: 1
    authenticator:
      authentication_type: jwt
    opendp_features: ["contrib", "floating-point", "honest-but-curious"]
    private_db_credentials:
      # - existing_secret: "" # Set this if there is an existing secret.
      # - credentials_name: "s3" # Or set the credentials directly.
      #  db_type: "S3_DB"
      #  access_key_id: "abc"
      #  secret_access_key: "def"
    telemetry:
      enabled: true
      service_name: lomas_server_app
      service_id: default-host
  pvc:
    storageClassName: "" # is not set if empty string
    sizeLimit: 500Mi
    sizeRequest: 500Mi
    accessMode: "ReadWriteOnce" # ReadWriteMany if supported, otherwise use affinity to colocate server, worker and dashboard.
    persistence:
      # If set to "keep", sets the helm/resource-policy of the pvc to keep,
      # so that the pvc is not deleted across reinstalls.
      resourcePolicy: ""

  service:
    type: ClusterIP
    port: 80
    portName: http

  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    hostname: "lomas-dada.lab.sspcloud.fr"
  # Openshift route for Openshift clusters.
  route:
    enabled: false
    annotations: {}
    hostname: "lomas-dada.lab.sspcloud.fr"
    tls:
      insecureEdgeTerminationPolicy: Redirect
      termination: edge
  # Lomas server not meant to be replicated for now
  replicaCount: 1
  # Lomas server not intended to be autoscaled for now
  # autoscaling:
  #  enabled: false
  #  minReplicas: 1
  #  maxReplicas: 100
  #  targetCPUUtilizationPercentage: 80
  #  targetMemoryUtilizationPercentage: 80

  # We leave unset stuff here
  serviceAccount:
    create: false
    annotations: {}
    name: ""
  resources: {}
    # limits:
    #   cpu: 100m
    #   memory: 128Mi
    # requests:
    #   cpu: 100m
    #   memory: 128Mi
  podAnnotations: {}
  podSecurityContext: {}
  securityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/component
            operator: In
            values:
            - worker
            - server
            - dashboard
        topologyKey: "kubernetes.io/hostname"

worker:
  replicaCount: 1
  serviceAccount:
    create: false
    annotations: {}
    name: ""
  resources: {}
  podAnnotations: {}
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}


