name: Build and Push Docker images

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]
  release:
    types: [published]

jobs:
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: dsccadminch/lomas_server
          # - image: dsccadminch/lomas_admin
          # - image: dsccadminch/lomas_client
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31.10.1
      - uses: cachix/cachix-action@v16
        with:
          name: lomas
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Install devenv.sh
        run: nix profile add nixpkgs/400de68cd101e8cfebffea121397683caf7f5a34#devenv

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images:
            ${{ matrix.image }}
          tags: |
            type=sha
            type=semver, pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Image
        run: devenv build outputs.lomas-oci

      - name: Push Image
        if: github.event_name == 'push' || github.event_name == 'release'
        run: |
          out=$(devenv build outputs.lomas-oci 2> /dev/null )
          $out | skopeo copy docker-archive:/dev/stdin docker://${{ matrix.image }}:${DOCKER_METADATA_OUTPUT_VERSION:-debug}
