[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
namespaces = false
where = ["."]

[project]
name = "lomas-core"
version = "0.4.1"
description = "Lomas core."
readme = "README.md"
requires-python = ">=3.11, <3.14"
authors = [
    { name = "Data Science Competence Center", email = "dscc@bfs.admin.ch" },
    { name = "Swiss Federal Statistical Office" },
]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "diffprivlib==0.6.6",
    "diffprivlib_logger==0.0.3",
    "fastapi[standard-no-fastapi-cloud-cli]==0.119.0",
    "orjson>=3.11", # for fastapi.ORJSONResponse
    "opendp==0.12.0",
    "opendp_logger==0.3.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-exporter-otlp>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "pandas>=2.2.2",
    "polars==1.12.0",
    "pydantic>=2.8,<2.12", # 2.12 breaks with fastapi
    "pydantic-settings>=2.8",
    "pymongo>=4.6.3",
    "smartnoise-synth>=1.0.4",
    "smartnoise_synth_logger>=0.0.3",
    "private-pgm",
]

[project.urls]
Homepage = "https://github.com/dscc-admin-ch/lomas/"

[tool.uv.sources]
private-pgm = { git = "https://github.com/ryan112358/private-pgm", rev = "01f02f17eba440f4e76c1d06fa5ee9eed0bd2bca" }
