{{- if .Values.dashboard.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lomas.dashboard.fullname" . }}-auth
  labels:
    {{- include "lomas.dashboard.labels" . | nindent 4 }}
stringData:
  secrets.toml: |
    [auth]
    client_id = "{{ .Values.dashboard.auth.clientId }}"
    client_secret = "{{ .Values.dashboard.auth.clientSecret }}"
    redirect_uri = "{{ .Values.dashboard.auth.redirectUri }}"
    server_metadata_url = "{{ .Values.dashboard.auth.serverMetadataUrl }}"
    cookie_secret = "{{ .Values.dashboard.auth.cookieSecret }}"
    expose_tokens = [{{- range $i, $v := .Values.dashboard.auth.exposeTokens }}{{ if $i }}, {{ end }}"{{ $v }}"{{- end }}]
{{- end }}