name: Docker Compose Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  tests:
    name: Run tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v30
    - uses: cachix/cachix-action@v15
      with:
        name: lomas
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

    - name: Install devenv.sh
      run: nix profile install nixpkgs#devenv

    - name: Run a notebook within a container
      run: |
        devenv shell
        cd server
        docker-compose-up &> docker-compose.logs &

        TIMEOUT=360
        INTERVAL=10
        ELAPSED=0

        while [ $ELAPSED -lt $TIMEOUT ]; do
          if docker container ls --format '{{.Names}}' | grep -q "lomas_client"; then
            sleep 5
            echo "Starting test"
            docker exec lomas_client python -m lomas_client.scripts.run_notebook --notebook /code/client/notebooks/income_minimal.ipynb
            res=$?
            cat docker-compose.logs
            docker-compose-down
            exit res
          fi
          sleep $INTERVAL
          ELAPSED=$((ELAPSED + INTERVAL))
        done
