[project]
name = "lomas"
version = "0.4.1"
requires-python = '>=3.11'
dependencies = [
  "lomas-core",
  "lomas-client",
  "lomas-server[all]",
  "torch>=2.6", # explicit torch dependency to get cpu-only impl. see: uv.sources
]

[project.optional-dependencies]
test = [
  "isort>=6.0",
  "black>=25.0",
  "flake8-pyproject>=1.2",
  "mypy>=1.15",
  "pylint>=3.3",
  "pydocstringformatter>=0.7",
  "coverage>=7.6",
  "pytest>=8.3",
  "pytest-cov>=6.0",
]

# workspace setup for uv
[tool.uv.sources]
lomas-core = { workspace = true }
lomas-client = { workspace = true }
lomas-server = { workspace = true }
torch = [{ index = "pytorch-cpu" }]

[tool.uv.workspace]
members = [ "core", "client", "server" ]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# workspace setup for setuptools (uv build)
[tool.setuptools.package-dir]
lomas-core = "core/lomas_core"
lomas-client = "client/lomas_client"
lomas-server = "server/lomas_server"

[tool.ruff]
line-length = 110
exclude = [ "*.ipynb", ".devenv"]

[tool.ruff.lint]
# ruff linter -> get available linter list
select = [
  "I", # isort
  "E", # pycodestyle
  "F", # Pyflakes
  "PLC", # Pylint Convention
  "PLE", # Pylint Error
  "UP", # pyupgrade
  "D", # pydocstyle
  # "FAST001", "FAST003", # FastAPI lint
  "DTZ", # flake8-datetimez
  "ICN", # flake8-import-conventions (numpy as np, pandas as pd, etc.)
  "PYI", # flake8-pyi
  # "LOG",
  # "PT", # Pytest-style (lots of fixes todo)
  "RSE", # flake8-raise
  "FLY", # flynt
  # "C90", # maccabe do we want it ?
  "NPY", # NumPy-specific rules
  # "PD", # Pandas-specific rules
  # "RUF", # Ruff-sepicifc rules
  "FURB", # Refurbishing and modernizing Python codebases
]
ignore = [
  "E501",
  "PLR2004", #Magic value used in comparison
  "PLR0913", #too-many-arguments
  "PLR0914", #too-many-locals
  "PLR0915", #too-many-statements
  "N812", #lowercase-imported-as-non-lowercase
  "D10", # Missing docstring in public module/package/__init__
  "D301", # Esacpe Sequence in docstring
  "D202", # No blank lines allowed after function docstring
  "D400", # missing trailing period
  "D401", # First line of docstring should be in imperative mood
  "PD901", # Avoid using the generic variable name `df` for DataFrames
]
isort.split-on-trailing-comma = true
isort.known-first-party = ["lomas_core", "lomas_server", "lomas_client"]
pydocstyle.convention = "pep257"
pep8-naming.extend-ignore-names = ["*Exception"]

[tool.black]
line-length = 110
include = '\.pyi?$'
extend_exclude = '\.ipynb'

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 110
split_on_trailing_comma = true
known_first_party = ["lomas_core", "lomas_server", "lomas_client"]
skip = [".gitignore", ".devenv"]

[tool.flake8]
max-line-length = 110
extend_exclude = [".devenv", "docs"]
extend-ignore=["E501", "W503"]

[tool.mypy]
plugins = ['pydantic.mypy']
disable_error_code = ["import-untyped", "import-not-found"]
no_site_packages = true
show_error_codes = true
show_column_numbers = true
follow_imports = "silent"
warn_redundant_casts = true
no_implicit_reexport = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "lomas_server.*.tests.*"
disallow_untyped_defs = false
disable_error_code = [ "attr-defined" ]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pylint.main]
max-line-length = 110
ignore-patterns = "test_*.py"
recursive = "yes"
ignore-paths = ".devenv,docs"

[tool.pylint."messages control"]
disable = [
    "fixme",
    "import-error", # fails in git-runner but not locally ?
    "duplicate-code",
    "too-many-locals",
    "logging-not-lazy",
    "undefined-variable", # handled by flake8
    "too-many-arguments",
    "too-few-public-methods",
    "dangerous-default-value",
    "missing-module-docstring",
    "logging-fstring-interpolation",
    "too-many-positional-arguments",
]

[tool.pydocstringformatter]
max-line-length = 110
write = true
exclude = [ ".devenv/**/*.py" ] # pydocstringformatter uses a wierd full path matching from glob.iglob

[tool.pytest.ini_options]
#syntax = action:message:category:module:line (@docs.python.org/3/library/warnings.html)
filterwarnings = [
  "ignore:'json' serialization format of LazyFrame is deprecated:UserWarning",
  "ignore::DeprecationWarning:(mbi|botocore|opendp_logger).*:",
]
addopts = [
  "--ignore-glob=*/test_streamlit_app_page_b.py"
]
markers = [
  "long: marks test as long (deselect with '-m \"not long\"')",
]

[tool.coverage.run]
source = [
  "./core/lomas_core",
  "./server/lomas_server",
  "./client/lomas_client"
]
relative_files = true

