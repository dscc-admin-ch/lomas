name: Publish to PyPI.org

on:
  pull_request:
    branches: [develop, master]
  release:
    types: [published]
  push:
    tags:
      - v*

jobs:
  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: 3.13

      - name: Build Packages
        run: |
          uv build --wheel core
          uv build --wheel client

      - name: Sanity Check
        run: |
          uv run --isolated --no-project --with dist/lomas_core-* python -c 'import lomas_core'
          uv run --isolated --no-project --with dist/lomas_core-* --with dist/lomas_client-* python -c 'import lomas_client'

      - name: Publish Packages
        if: github.event_name == 'release' || github.ref_type == 'tag'
        run: |
          for pkg in core client; do
            localVer=$(awk -F' *= *' '/version/{gsub(/"/,"",$2);print $2}' "${pkg}/pyproject.toml")
            res=$(curl -s "https://pypi.org/pypi/lomas-${pkg}/${localVer}/json" | jq -r '.last_serial')
            if [ "$res" = "null" ]; then
              uv publish --check-url https://pypi.org/simple --token ${{ secrets.PYPI_TOKEN }} dist/lomas_${pkg}-${localVer}-*
            else
              echo "lomas-${pkg} v${localVer} already published"
            fi
          done
