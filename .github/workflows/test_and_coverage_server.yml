name: Server Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  client-notebooks:
    name: Client Notebooks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v30
    - uses: cachix/cachix-action@v15
      with:
        name: lomas
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

    - name: Install devenv.sh
      run: nix profile install nixpkgs#devenv

    - name: Restore UV cache
      uses: actions/cache@v4
      id: uv-cache
      with:
        path: /home/runner/.cache/uv
        key: uv-store-3.12-${{ hashFiles('uv.lock') }}
        restore-keys: uv-store-3.12-

    - name: Run all test with coverage
      run: devenv shell -- ut-coverage client/ -v

    - name: Store UV cache
      uses: actions/cache@v4
      if: steps.uv-cache.outputs.cache-hit != 'true'
      with:
        path: /home/runner/.cache/uv
        key: uv-store-3.12-${{ hashFiles('uv.lock') }}

    - run: mv .coverage .coverage.client
    - name: Store coverage file
      uses: actions/upload-artifact@v4
      with:
        name: coverage-client
        path: .coverage.client
        include-hidden-files: true
    - name: Store logs
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: test-logs-notebooks
        path: logs/*
        include-hidden-files: true


  server-matrix:
    name: Server CI Py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13]

    steps:
    - uses: actions/checkout@v4
    - uses: cachix/install-nix-action@v30
    - uses: cachix/cachix-action@v15
      with:
        name: lomas
        authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

    - name: Install devenv.sh
      run: nix profile install nixpkgs#devenv

    - name: Restore UV cache
      uses: actions/cache@v4
      id: uv-cache
      with:
        path: /home/runner/.cache/uv
        key: uv-store-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
        restore-keys: uv-store-${{ matrix.python-version }}-

    - name: Set Python package
      run: |
        cat > devenv.local.nix <<EOF
        { pkgs, ... }: { languages.python.package = pkgs.python$(echo ${{ matrix.python-version }} | tr -d .); }
        EOF

    - name: Run all test with coverage
      run: devenv shell -- ut-coverage server/

    - name: Store UV cache
      uses: actions/cache@v4
      if: steps.uv-cache.outputs.cache-hit != 'true'
      with:
        path: /home/runner/.cache/uv
        key: uv-store-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}

    - run: mv .coverage .coverage.${{ matrix.python-version }}
    - name: Store coverage file
      uses: actions/upload-artifact@v4
      with:
        name: coverage-${{ matrix.python-version }}
        path: .coverage.${{ matrix.python-version }}
        include-hidden-files: true
    - name: Store logs
      uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: test-logs-${{ matrix.python-version }}
        path: logs/*
        include-hidden-files: true

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [ client-notebooks, server-matrix ]
    permissions:
      # Gives the action the necessary permissions for publishing new
      # comments in pull requests.
      pull-requests: write
      # Gives the action the necessary permissions for pushing data to the
      # python-coverage-comment-action branch, and for editing existing
      # comments (to avoid publishing multiple comments in the same PR)
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        id: download
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Coverage comment
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.COVERAGE_REPORT }}
          MINIMUM_GREEN: 95
          MINIMUM_ORANGE: 75
          MERGE_COVERAGE_FILES: true

      - name: Store Pull Request comment to be posted
        uses: actions/upload-artifact@v4
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          name: python-coverage-comment-action
          path: python-coverage-comment-action.txt
