apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "lomas.caddy.configMapName" . }}
  labels:
    {{- include "lomas.caddy.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.caddy.configAnnotations | nindent 4 }}
data:
  Caddyfile: |
    {
      debug
      auto_https disable_redirects
      # servers {
      #   trusted_proxies static private_ranges
      # }
    }

    {{ .Values.caddy.hostname }}:{{ .Values.caddy.port }} {

      handle_path /auth/* {
        reverse_proxy {{ include "common.names.fullname" (dict "Release" .Release "Chart" (dict "Name" "keycloak") "Values" .Values.keycloak) -}}:{{ .Values.keycloak.service.ports.http }}
      }

      handle /oauth2/* {
        reverse_proxy {{ include "lomas.oauth2proxy.fullname" . }}:{{ .Values.oauth2proxy.service.port }} {
          header_up X-Real-IP {remote_host}
          header_up X-Forwarded-Uri {uri}
        }
      }

      # Need to redirect openapi.json in order for docs to work (needed json for swagger)
      handle /openapi.json {
        reverse_proxy {{ include "lomas.server.fullname" .}}:{{ .Values.server.service.port }}
      }

      # Server handles auth/authz by itself so simply forward
      handle_path /api/* {
        reverse_proxy {{ include "lomas.server.fullname" .}}:{{ .Values.server.service.port }}
      }

      handle {
        forward_auth {{ include "lomas.oauth2proxy.fullname" . }}:{{ .Values.oauth2proxy.service.port }} {
          uri /oauth2/auth
          header_up X-Real-IP {remote_host}
          copy_headers X-Auth-Request-User X-Auth-Request-Email X-Auth-Request-Preferred-Username X-Auth-Request-Groups

          @error status 401
          handle_response @error {
            redir * /oauth2/sign_in?rd=https://{host}{uri}
          }
        }

        # Recognize admin users
        # The **realm-role** assign to the lomas-admin **Group** (via role-mappings)
        @admin header X-Auth-Request-Groups *role:authp/admin*

        handle @admin {
          handle_path /dashboard* {
            reverse_proxy {{ include "lomas.dashboard.fullname" . }}:{{ .Values.dashboard.service.port }}
          }

          handle_path /grafana* {
            reverse_proxy {{ include "lomas.grafana.fullname" . }}:{{ .Values.grafana.service.port }}
          }

          handle_path /rabbitmq* {
             reverse_proxy {{ include "common.names.fullname" (dict "Release" .Release "Chart" (dict "Name" "rabbitmq") "Values" .Values.rabbitmq) -}}:{{ .Values.rabbitmq.service.ports.manager }}
          }
        }

        respond "Hello World"
      }
    }
