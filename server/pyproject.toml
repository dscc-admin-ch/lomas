[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "lomas_server" }

[project]
name = "lomas-server"
version = "0.4.1"
description = "Lomas server."
readme = "README.md"
requires-python = ">=3.11, <3.13"
authors = [
    { name = "Data Science Competence Center", email = "dscc@bfs.admin.ch" },
    { name = "Swiss Federal Statistical Office" },
]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "lomas-core==0.4.1",
  "boto3==1.34.115",
  "cryptography==44.0.0",
  "httpx==0.27.0",
  "jax==0.4.31",
  "jaxlib==0.4.31",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "opentelemetry-instrumentation-logging>=0.50b0",
  "opentelemetry-instrumentation-pymongo>=0.50b0",
  "opentelemetry-instrumentation-aio-pika==0.50b0",
  "pyaml==23.9.5",
  "pydantic==2.8.2",
  "pyjwt==2.10.1",
  "smartnoise-sql==1.0.6",
  "uvicorn==0.29.0",
  "aio-pika==9.5.4",
]
[project.optional-dependencies]
all = [
  "mantelo==2.2.0",
  "mongomock==4.3.0",
  "streamlit==1.39.0",
  "st-pages==0.5.0",
]

[project.urls]
Homepage = "https://github.com/dscc-admin-ch/lomas/"

[tool.pytest.ini_options]
addopts = [
  "--ignore-glob=*/test_streamlit_app_page_b.py"
]
markers = [
  "long: marks test as long (deselect with '-m \"not long\"')",
]
