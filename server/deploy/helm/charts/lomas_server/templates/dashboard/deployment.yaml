{{- if .Values.dashboard.create -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lomas.dashboard.fullname" . }}
  labels:
    {{- include "lomas.dashboard.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "lomas.dashboard.selectorLabels" . | nindent 6 }}
  replicas: 1
  template:
    metadata:
      {{- with .Values.dashboard.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "lomas.dashboard.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "lomas.dashboard.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.dashboard.podSecurityContext | nindent 8 }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8}}
      initContainers:
      - name: keycloak-check
        image: {{.Values.admin.curlImage.repository -}}:{{- .Values.admin.curlImage.tag }}
        imagePullPolicy: {{ .Values.admin.curlImage.pullPolicy }}
        resources:
          {{- toYaml .Values.admin.initContainers.resources | nindent 10 }}
        command:
          - sh
          - -c
          - >
            until curl http://{{- include "common.names.fullname" (dict "Release" .Release "Chart" (dict "Name" "keycloak") "Values" .Values.keycloak) -}}/realms/master; do
              echo "Keycloak not ready yet";
              sleep 10;
            done;
            while true; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://{{- include "common.names.fullname" (dict "Release" .Release "Chart" (dict "Name" "keycloak") "Values" .Values.keycloak) -}}/realms/{{- .Values.admin.realm -}})
              echo "Lomas realm query status: $STATUS"
              if [[ $STATUS == "200" ]]; then
                echo "Lomas realm ready."
                exit 0;
              fi;
              sleep 10;
            done;
      # TODO: remove once the server supports connection retries to the mongodb issue 424.
      - name: mongo-check
        image: {{ include "mongodb.image" (dict "Release" .Release "Chart" (dict "Name" "mongodb") "Values" .Values.mongodb) }}
        resources:
          {{- toYaml .Values.admin.initContainers.resources | nindent 10 }}
        command:
          - sh
          - -c
          - >
            until mongosh --host {{ include "mongodb.service.nameOverride" (dict "Release" .Release "Chart" (dict "Name" "mongodb") "Values" .Values.mongodb) }} --eval 'if (!(db.hello().isWritablePrimary || db.hello().secondary)){throw new Error("Not ready")}'; do
              echo "Mongo not ready yet";
              sleep 10;
            done;
            echo "Mongo ready"
            exit 0;
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
            {{- toYaml .Values.dashboard.securityContext | nindent 12 }}
        resources:
          {{- toYaml .Values.dashboard.resources | nindent 10 }}
        image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
        imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
        ports:
          - name: http
            containerPort: {{ .Values.dashboard.serverConfig.port }}
            protocol: TCP
        volumeMounts:
          - name: dashboard-server-config
            readOnly: True
            mountPath: "/code/.streamlit/"
        volumeMounts:
          - name: data
            mountPath: /persistent-storage
        env:
          - name: LOMAS_ADMIN_MG_CONFIG__URL
            value: "mongodb://{{- include "mongodb.service.nameOverride" (dict "Release" .Release "Chart" (dict "Name" "mongodb") "Values" .Values.mongodb) -}}:{{ .Values.mongodb.service.ports.mongodb }}/{{ index .Values.mongodb.auth.databases 0}}"
          - name: LOMAS_ADMIN_MG_CONFIG__USERNAME
            value: "{{ index .Values.mongodb.auth.usernames 0 }}"
          - name: LOMAS_ADMIN_MG_CONFIG__PASSWORD
            value: "{{ index .Values.mongodb.auth.passwords 0 }}"
          - name: LOMAS_ADMIN_MG_CONFIG__MAX_POOL_SIZE
            value: "{{ .Values.mongodb.max_pool_size }}"
          - name: LOMAS_ADMIN_MG_CONFIG__MIN_POOL_SIZE
            value: "{{ .Values.mongodb.min_pool_size }}"
          - name: LOMAS_ADMIN_MG_CONFIG__MAX_CONNECTING
            value: "{{ .Values.mongodb.max_connecting }}"
          - name: LOMAS_ADMIN_KC_CONFIG__URL
            value: "https://{{ .Values.caddy.hostname }}/auth"
          - name: LOMAS_ADMIN_KC_CONFIG__REALM
            value: "{{ .Values.admin.realm }}"
          - name: LOMAS_ADMIN_KC_CONFIG__CLIENT_ID
            value: "{{ .Values.admin.client_id }}"
          - name: LOMAS_ADMIN_KC_CONFIG__CLIENT_SECRET
            value: "{{ .Values.admin.client_secret }}"
          - name: LOMAS_ADMIN_PATH_PREFIX
            value: "{{ .Values.admin.demo_setup.path_prefix }}"
          - name: LOMAS_ADMIN_USER_YAML
            value: "{{ .Values.admin.demo_setup.user_yaml_path }}"
          - name: LOMAS_ADMIN_DATASET_YAML
            value: "{{ .Values.admin.demo_setup.dataset_yaml_path }}"
          - name: LOMAS_ADMIN_SERVER_URL
            value: "https://{{ .Values.server.ingress.hostname }}"
          - name: LOMAS_ADMIN_SERVER_SERVICE
            value: "https://{{ .Values.server.ingress.hostname }}"
            # value: "http://{{ include "lomas.server.fullname" . }}:{{ .Values.server.service.port }}"
      volumes:
        {{- $fullname := include "lomas.dashboard.fullname" . }}
        - name: dashboard-server-config
          projected:
            sources:
            - configMap:
                name: {{ printf "%s-server-config" $fullname }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "lomas.server.fullname" . }}
      {{- with .Values.dashboard.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dashboard.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
