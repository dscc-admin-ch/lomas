name: Generate docs and push to dedicated repo for publishing

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31.10.1
      - uses: cachix/cachix-action@v17
        with:
          name: lomas
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install devenv.sh
        run: nix profile add nixpkgs/d233902339c02a9c334e7e593de68855ad26c4cb#devenv

      - name: Build the doc
        run: devenv shell -- build-docs

      - name: Publish doc
        if: github.event_name == 'push' || github.event_name == 'release'
        run: devenv shell -- mike deploy develop --push
