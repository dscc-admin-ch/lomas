apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "lomas.worker.fullname" . }}
  labels:
    {{- include "lomas.worker.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "lomas.worker.selectorLabels" . | nindent 6 }}
  replicas: {{ .Values.worker.replicaCount }}
  template:
    metadata:
      {{- with .Values.worker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "lomas.worker.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "lomas.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.worker.podSecurityContext | nindent 8 }}
      imagePullSecrets:
        {{- toYaml .Values.global.imagePullSecrets | nindent 8}}
      containers:
      - name: {{ include "lomas.worker.fullname" . }}
        securityContext:
            {{- toYaml .Values.worker.securityContext | nindent 12 }}
        resources:
          {{- toYaml .Values.worker.resources | nindent 10 }}
        image: "{{ .Values.server.image.repository }}:{{ .Values.server.image.tag }}"
        imagePullPolicy: {{ .Values.server.image.pullPolicy }}
        command: ["lomas-work"]
        ports:
          - name: http
            containerPort: {{ .Values.server.runtime_args.server.host_port }}
            protocol: TCP
        volumeMounts:
          - name: data
            mountPath: /persistent-storage
        env:
          - name: LOMAS_SERVICE_PORT
            value: "{{ .Values.server.runtime_args.server.host_port }}"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "lomas.server.fullname" . }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
