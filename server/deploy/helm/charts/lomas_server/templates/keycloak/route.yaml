{{- if .Values.keycloak.create -}}
{{- if .Values.keycloak.route.enabled -}}
{{- $fullName := include "common.names.fullname" (dict "Release" .Release "Chart" (dict "Name" "keycloak") "Values" .Values.keycloak) -}}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $fullName }}
  {{- $labels := include "common.tplvalues.merge" ( dict "values" ( list .Values.keycloak.route.labels .Values.commonLabels ) "context" (dict "Release" .Release "Chart" (dict "Name" "keycloak") "Values" .Values.keycloak) ) }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" $labels "context" (dict "Release" .Release "Chart" (dict "Name" "keycloak") "Values" .Values.keycloak) ) | nindent 4 }}
    app.kubernetes.io/component: keycloak
  {{- if or .Values.keycloak.route.annotations .Values.commonAnnotations }}
  {{- $annotations := include "common.tplvalues.merge" ( dict "values" ( list .Values.ingress.annotations .Values.commonAnnotations ) "context" (dict "Release" .Release "Chart" (dict "Name" "keycloak") "Values" .Values.keycloak) ) }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $annotations "context" (dict "Release" .Release "Chart" (dict "Name" "keycloak") "Values" .Values.keycloak)) | nindent 4 }}
  {{- end }}
spec:
  host: {{ .Values.keycloak.route.hostname | quote }}
  path: /
  port:
    targetPort: http
  to:
    kind: Service
    name: {{ $fullName }}
  tls:
    {{- toYaml .Values.keycloak.route.tls | nindent 4 }}
{{- end }}
{{- end }}