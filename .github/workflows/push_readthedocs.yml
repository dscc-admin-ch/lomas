name: Generate docs and push to dedicated repo for publishing

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]
    tags: [v*]
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31.10.1
      - uses: cachix/cachix-action@v17
        with:
          name: lomas
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install devenv.sh
        run: nix profile add nixpkgs/64c08a7ca051951c8eae34e3e3cb1e202fe36786#devenv

      - name: Build the doc
        run: devenv shell -- build-docs

      - name: Set git credentials
        run: |
          git config --global user.name "${GITHUB_ACTOR}"
          git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"

      - name: Publish Develop doc
        if: github.event_name == 'push' || github.event_name == 'release'
        run: devenv shell -- mike deploy develop --push

      - name: Publish Tag doc
        if: github.ref_type == 'tag'
        run: devenv shell -- mike deploy ${{ github.ref_name }} latest --update-aliases --push
