[project]
name = "lomas"
version = "0.4.1"
requires-python = '>=3.11'
dependencies = [
  "lomas-core",
  "lomas-client",
  "lomas-server[all]",
  "torch>=2.6", # explicit torch dependency to get cpu-only impl. see: uv.sources
]

[project.optional-dependencies]
test = [
  "black>=25.0",
  "ruff>=0.11",
  "mypy>=1.15",
  "pylint>=3.3",
  "pydocstringformatter>=0.7",
  "coverage>=7.6",
  "pytest>=8.3",
  "pytest-cov>=6.0",
]
docs = [
  "sphinx>=7.0",
  "sphinx-rtd-theme>=2.0",
  "myst-parser>=3.0",
  "sphinx-autodoc-typehints>=2.0",
]

# workspace setup for uv
[tool.uv.sources]
lomas-core = { workspace = true }
lomas-client = { workspace = true }
lomas-server = { workspace = true }
torch = [{ index = "pytorch-cpu" }]

[tool.uv.workspace]
members = [ "core", "client", "server" ]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# workspace setup for setuptools (uv build)
[tool.setuptools.package-dir]
lomas-core = "core/lomas_core"
lomas-client = "client/lomas_client"
lomas-server = "server/lomas_server"

[tool.ruff]
line-length = 110
exclude = [ "*.ipynb" ]

[tool.ruff.lint]
# ruff linter -> get available linter list
select = [
  "I", # isort
  # E,F,W together cover Flake8
  "E", "W", # pycodestyle
  "F", # Pyflakes
  "PL", # Pylint Full
  "PLC", # Pylint Convention
  "PLE", # Pylint Error
  "UP", # pyupgrade
  "D", # pydocstyle see @pydocstyle.convention
  "FAST001", "FAST003", # FastAPI lint
  "DTZ", # flake8-datetimez
  "ICN", # flake8-import-conventions (numpy as np, pandas as pd, etc.)
  "PYI", # flake8-pyi
  # "LOG",
  "PT", # Pytest-style (lots of fixes todo)
  "RSE", # flake8-raise
  "FLY", # flynt
  # "C90", # maccabe do we want it ?
  "NPY", # NumPy-specific rules
  "PD", # Pandas-specific rules
  "RUF", # Ruff-specific rules
  "FURB", # Refurbishing and modernizing Python codebases
  "PGH004", # blanket noqa comments
  "RET501", "RET502",  # better return None handling
]
ignore = [
  "E501",
  "PLR0912", # too-many-branches
  "PLR0913", # too-many-arguments
  "PLR0914", # too-many-locals
  "PLR0915", # too-many-statements
  "PLR2004", # Magic value used in comparison
  "N812", # lowercase-imported-as-non-lowercase
  "D10", # Missing docstring in public module/package/__init__
  "D301", # Esacpe Sequence in docstring
  "D202", # No blank lines allowed after function docstring
  "D400", # First line should end with a period
  "D401", # First line of docstring should be in imperative mood
  "PD901", # Avoid using the generic variable name `df` for DataFrames
  "PT011", # FIXME
  "PLW1510", # TODO: check if doc still build
]
pydocstyle.convention = "pep257"
pep8-naming.extend-ignore-names = ["*Exception"]

[tool.ruff.lint.isort]
combine-as-imports = true
split-on-trailing-comma = true
extra-standard-library = ["test"]
known-first-party = ["lomas_core", "lomas_server", "lomas_client"]

[tool.black]
line-length = 110
include = '\.pyi?$'
extend_exclude = '\.ipynb'

[tool.mypy]
plugins = ['pydantic.mypy']
disable_error_code = ["import-untyped", "import-not-found"]
enable_error_code = ["truthy-bool"]
no_site_packages = true
show_error_codes = true
show_column_numbers = true
follow_imports = "silent"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true
disallow_untyped_defs = true
pretty = true

[[tool.mypy.overrides]]
module = [
  "lomas_client.tests.*",
  "lomas_server.tests.*",
  "lomas_server.administration.tests.*"
]
disallow_untyped_defs = false
disable_error_code = [ "attr-defined" ]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pylint.main]
max-line-length = 110
ignore-patterns = "test_.*py$"
recursive = "yes"
ignore-paths = ".devenv,docs"

[tool.pylint."messages control"]
disable = [
    "fixme",
    "import-error", # fails in git-runner but not locally ?
    "duplicate-code", # FIXME
    "too-many-locals", # ruff PLR0914
    "logging-not-lazy",
    "undefined-variable", # handled by ruff
    "wrong-import-order", # handled by ruff
    "too-many-arguments", # ruff PLR0913
    "too-few-public-methods",
    "dangerous-default-value",
    "missing-module-docstring",
    "logging-fstring-interpolation",
    "too-many-positional-arguments", # ruff PLR0917
]

[tool.pydocstringformatter]
max-line-length = 110
write = true
exclude = [ ".devenv/**/*.py" ] # pydocstringformatter uses a wierd full path matching from glob.iglob

[tool.pytest.ini_options]
#syntax = action:message:category:module:line (@docs.python.org/3/library/warnings.html)
filterwarnings = [
  "ignore:'json' serialization format of LazyFrame is deprecated:UserWarning",
  "ignore::DeprecationWarning:(mbi|botocore|opendp_logger).*:",
]
addopts = [
  "--import-mode=importlib",
]
markers = [
  "long: marks test as long (deselect with '-m \"not long\"')",
]

[tool.coverage.run]
source = [
  "./core/lomas_core",
  "./server/lomas_server",
  "./client/lomas_client"
]
relative_files = true
omit = [
  "**/uvicorn_serve.py",
  "**/b_database_administration.py",
]

[tool.coverage.report]
exclude_also = [
  # Don't complain if tests don't hit defensive assertion code:
  "raise (AssertionError|NotImplementedError|TimeoutError)",
  '(except|raise) InternalServerException',
  'except (KNOWN_EXCEPTIONS|Exception|yaml.YAMLError)',
  'case _:',
  # Don't complain about missing debug-only code:
  "def __repr__",
  # Don't complain if non-runnable code isn't run:
  "if __name__ == .__main__.:",
]
