[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "lomas_core" }

[project]
name = "lomas-core"
version = "0.4.1"
description = "Lomas core."
readme = "README.md"
requires-python = ">=3.11, <3.13"
authors = [
    { name = "Data Science Competence Center", email = "dscc@bfs.admin.ch" },
    { name = "Swiss Federal Statistical Office" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "diffprivlib==0.6.5",
    "diffprivlib_logger==0.0.3",
    "fastapi==0.115.11",
    "numpy==1.26.4",
    "opendp==0.12.0",
    "opendp_logger==0.3.0",
    "opentelemetry-api>=1.29.0",
    "opentelemetry-exporter-otlp>=1.29.0",
    "opentelemetry-sdk>=1.29.0",
    "pandas>=2.2.2",
    "polars==1.12.0",
    "pyarrow==16.1.0",
    "pymongo>=4.6.3",
    "scikit-learn>=1.4.2",
    "smartnoise-synth>=1.0.4",
    "smartnoise_synth_logger>=0.0.3",
]

[project.urls]
Homepage = "https://github.com/dscc-admin-ch/lomas/"
