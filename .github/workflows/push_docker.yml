name: Build and Push Docker images

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop]
  release:
    types: [published]

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31.10.1
      - uses: cachix/cachix-action@v17
        with:
          name: lomas
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - name: Install devenv.sh
        run: nix profile add nixpkgs/68e77efe98d409641a4e25266914d225cd879798#devenv

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images:
            dsccadminch/lomas
          tags: |
            type=sha
            type=semver, pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Image
        run: devenv build outputs.lomas-oci

      - name: Push Image
        # if: github.event_name == 'push' || github.event_name == 'release'
        run: |
          devenv build outputs.lomas-oci 2>/dev/null | jq -r '.[]' | xargs -trn1 cat | skopeo copy docker-archive:/dev/stdin docker://dsccadminch/lomas:${DOCKER_METADATA_OUTPUT_VERSION:-debug}
          devenv build outputs.lomas-oci-raw 2>/dev/null | jq -r '.[]' | xargs -trn1 cat | skopeo copy docker-archive:/dev/stdin docker://dsccadminch/lomas-raw:${DOCKER_METADATA_OUTPUT_VERSION:-debug}
