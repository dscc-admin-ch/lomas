name: Linter checks

on:
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
      - uses: cachix/cachix-action@v15
        with:
          name: lomas
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Install devenv.sh
        run: nix profile install nixpkgs/400de68cd101e8cfebffea121397683caf7f5a34#devenv

      - name: Restore UV cache
        uses: actions/cache@v4
        id: uv-cache
        with:
          path: /home/runner/.cache/uv
          key: uv-store-3.12-${{ hashFiles('uv.lock') }}
          restore-keys: uv-store-3.12-

      - name: ruff
        run: devenv shell -- ruff check core/lomas_core client/lomas_client server/lomas_server

      - name: mypy
        run: devenv shell -- mypy core/lomas_core client/lomas_client server/lomas_server
