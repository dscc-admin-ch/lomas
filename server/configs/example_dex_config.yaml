# This file was autogenerated by devenv

# Minimal example config to run Lomas with dex (not production worthy!).
issuer: http://localhost:4445/dex
web:
  http: 127.0.0.1:4445

storage:
  type: sqlite3
  config:
    file: $XDG_RUNTIME_DIR/dex.db

grpc:
  addr: 127.0.0.1:4446

# Enable local users
enablePasswordDB: true
# Allow password grants with local users
oauth2:
  passwordConnector: local

staticClients:
  # lomas api server
  - id: lomas_api
    public: false
    name: lomas_api
    secret: lomas_api
  # lomas client lib
  - id: lomas_client
    public: true
    name: lomas_client
    redirectURIs:
      # Enables device auth flow
      - '/device/callback'
  # lomas dashboard
  - id: lomas_dashboard
    public: false
    name: lomas_dashboard
    secret: lomas_dashboard
    redirectURIs:
      - http://localhost:8501/oauth2callback
  # lomas grafana
  - id: lomas_grafana
    public: false
    name: lomas_grafana
    secret: lomas_grafana
    redirectURIs:
      - http://localhost:3000/login/generic_oauth

staticPasswords:
  # Beware: static passwords cannot be deleted in dex.
